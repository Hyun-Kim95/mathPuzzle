<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-surface {
            background: rgba(19, 27, 46, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-glow-primary {
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
        }
        .neon-border-glow {
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
        }
        .math-pattern {
            background-image: radial-gradient(rgba(0, 229, 255, 0.1) 1px, transparent 1px);
            background-size: 32px 32px;
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary-fixed": "#001f24",
                    "tertiary": "#ffe8e1",
                    "surface": "#0b1326",
                    "inverse-surface": "#dae2fd",
                    "primary": "#c3f5ff",
                    "on-background": "#dae2fd",
                    "surface-dim": "#0b1326",
                    "primary-fixed": "#9cf0ff",
                    "on-secondary-fixed": "#002113",
                    "surface-container-lowest": "#060e20",
                    "error-container": "#93000a",
                    "surface-tint": "#00daf3",
                    "surface-container-high": "#222a3d",
                    "primary-fixed-dim": "#00daf3",
                    "surface-variant": "#2d3449",
                    "on-tertiary-fixed-variant": "#832600",
                    "on-tertiary": "#5d1900",
                    "background": "#0b1326",
                    "on-surface-variant": "#bac9cc",
                    "on-secondary-container": "#00714d",
                    "on-tertiary-container": "#a23200",
                    "secondary": "#f4fff6",
                    "surface-container-highest": "#2d3449",
                    "primary-container": "#00e5ff",
                    "on-secondary-fixed-variant": "#005236",
                    "inverse-on-surface": "#283044",
                    "secondary-container": "#00feb1",
                    "outline-variant": "#3b494c",
                    "on-error-container": "#ffdad6",
                    "on-error": "#690005",
                    "tertiary-container": "#ffc3b0",
                    "on-surface": "#dae2fd",
                    "on-primary-container": "#00626e",
                    "on-secondary": "#003824",
                    "on-primary-fixed-variant": "#004f58",
                    "error": "#ffb4ab",
                    "surface-container-low": "#131b2e",
                    "outline": "#849396",
                    "on-primary": "#00363d",
                    "tertiary-fixed-dim": "#ffb59d",
                    "surface-bright": "#31394d",
                    "secondary-fixed": "#47ffb8",
                    "tertiary-fixed": "#ffdbd0",
                    "surface-container": "#171f33",
                    "secondary-fixed-dim": "#00e29d",
                    "on-tertiary-fixed": "#390c00",
                    "inverse-primary": "#006875"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xl": "80px",
                    "base": "8px",
                    "xs": "4px",
                    "lg": "48px",
                    "gutter": "24px",
                    "margin-desktop": "64px",
                    "sm": "12px",
                    "margin-mobile": "16px",
                    "md": "24px"
            },
            "fontFamily": {
                    "label-caps": ["Sora"],
                    "display-lg": ["Sora"],
                    "body-sm": ["Sora"],
                    "body-lg": ["Sora"],
                    "headline-md": ["Sora"],
                    "display-lg-mobile": ["Sora"]
            },
            "fontSize": {
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "display-lg-mobile": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-lg flex flex-col min-h-screen overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Top App Bar -->
<header class="w-full top-0 left-0 bg-transparent flex justify-between items-center px-margin-mobile py-base z-50 fixed">
<div class="flex items-center gap-md">
<button class="text-primary-container hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined">grid_view</span>
</button>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile tracking-tighter text-primary-container drop-shadow-[0_0_10px_rgba(0,229,255,0.5)]">MATHEMAGIX</h1>
<div class="flex items-center gap-md">
<button class="text-primary-container hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</header>
<!-- Main Content Arena -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile pt-32 pb-40 math-pattern relative">
<!-- Background Geometric Decorations -->
<div class="absolute inset-0 overflow-hidden pointer-events-none">
<div class="absolute top-1/4 -left-12 w-64 h-64 border border-primary-container/20 rounded-full blur-xl"></div>
<div class="absolute bottom-1/4 -right-12 w-80 h-80 border border-secondary-container/10 rotate-45"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary-container/5 rounded-full blur-[120px]"></div>
</div>
<!-- Success Message -->
<div class="text-center mb-lg relative z-10">
<h2 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary-container neon-glow-primary mb-base">BRILLIANT!</h2>
<p class="font-body-lg text-on-surface-variant">You've unlocked the next sequence.</p>
</div>
<!-- Rewards Bento Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md w-full max-w-2xl mb-lg relative z-10">
<!-- Points Card -->
<div class="glass-surface p-md rounded-xl flex flex-col items-center justify-center text-center neon-border-glow">
<span class="material-symbols-outlined text-[48px] text-primary-container mb-xs" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="font-headline-md text-headline-md text-primary">+50 XP</span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase mt-1">Experience Gained</span>
</div>
<!-- Stars Card -->
<div class="glass-surface p-md rounded-xl flex flex-col items-center justify-center text-center">
<span class="material-symbols-outlined text-[48px] text-secondary-container mb-xs" style="font-variation-settings: 'FILL' 1;">grade</span>
<span class="font-headline-md text-headline-md text-secondary-container">+10 Stars</span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase mt-1">Mastery Bonus</span>
</div>
</div>
<!-- Level Progress Container -->
<div class="w-full max-w-2xl glass-surface p-md rounded-xl mb-xl relative z-10">
<div class="flex justify-between items-center mb-base">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Level 12</span>
<span class="font-label-caps text-label-caps text-primary-container">80% to Level 13</span>
</div>
<div class="w-full h-2 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary-container w-[80%] shadow-[0_0_12px_rgba(0,229,255,0.8)]"></div>
</div>
</div>
<!-- Action Buttons Cluster -->
<div class="flex flex-col md:flex-row gap-md w-full max-w-md relative z-10">
<button class="flex-1 bg-primary-container text-on-primary-container font-headline-md text-headline-md py-md px-lg rounded-xl shadow-[0_0_25px_rgba(0,229,255,0.4)] hover:opacity-90 active:scale-95 transition-all">
                NEXT LEVEL
            </button>
<button class="flex-1 border border-outline-variant bg-surface-container-low text-on-surface font-headline-md text-headline-md py-md px-lg rounded-xl hover:bg-surface-variant active:scale-95 transition-all">
                BACK TO MAP
            </button>
</div>
</main>
<!-- Success Visual Elements (Overlay shapes) -->
<div class="fixed inset-0 pointer-events-none z-0">
<div class="absolute top-[20%] right-[15%]">
<span class="material-symbols-outlined text-primary-container/20 text-6xl rotate-12">architecture</span>
</div>
<div class="absolute bottom-[30%] left-[10%]">
<span class="material-symbols-outlined text-secondary-container/20 text-5xl -rotate-12">function</span>
</div>
<div class="absolute top-[60%] right-[5%]">
<span class="material-symbols-outlined text-tertiary-container/20 text-7xl rotate-45">shape_line</span>
</div>
</div>
<!-- Bottom Nav Bar (Suppressed on Success Screen as per UX guidelines to prioritize content, but available if user needs to escape context) -->
<!-- Not rendering as it's a 'Success' Splash screen focused journey -->
</body></html>
