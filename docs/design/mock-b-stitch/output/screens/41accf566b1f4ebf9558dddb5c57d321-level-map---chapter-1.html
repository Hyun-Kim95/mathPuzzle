<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#00feb1",
                        "on-surface": "#dae2fd",
                        "tertiary-fixed-dim": "#ffb59d",
                        "surface-container-lowest": "#060e20",
                        "tertiary-container": "#ffc3b0",
                        "surface-tint": "#00daf3",
                        "primary-fixed": "#9cf0ff",
                        "outline-variant": "#3b494c",
                        "inverse-primary": "#006875",
                        "on-primary": "#00363d",
                        "surface": "#0b1326",
                        "on-background": "#dae2fd",
                        "on-secondary-fixed": "#002113",
                        "primary": "#c3f5ff",
                        "primary-fixed-dim": "#00daf3",
                        "on-tertiary-fixed": "#390c00",
                        "surface-variant": "#2d3449",
                        "surface-bright": "#31394d",
                        "on-secondary-container": "#00714d",
                        "on-primary-container": "#00626e",
                        "on-error": "#690005",
                        "secondary-fixed": "#47ffb8",
                        "surface-container": "#171f33",
                        "inverse-surface": "#dae2fd",
                        "on-tertiary-container": "#a23200",
                        "on-tertiary-fixed-variant": "#832600",
                        "on-surface-variant": "#bac9cc",
                        "secondary-fixed-dim": "#00e29d",
                        "surface-container-highest": "#2d3449",
                        "surface-container-high": "#222a3d",
                        "on-error-container": "#ffdad6",
                        "on-primary-fixed": "#001f24",
                        "tertiary": "#ffe8e1",
                        "tertiary-fixed": "#ffdbd0",
                        "outline": "#849396",
                        "error": "#ffb4ab",
                        "on-primary-fixed-variant": "#004f58",
                        "on-secondary-fixed-variant": "#005236",
                        "on-secondary": "#003824",
                        "surface-container-low": "#131b2e",
                        "primary-container": "#00e5ff",
                        "surface-dim": "#0b1326",
                        "inverse-on-surface": "#283044",
                        "secondary": "#f4fff6",
                        "background": "#0b1326",
                        "on-tertiary": "#5d1900",
                        "error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "xs": "4px",
                        "md": "24px",
                        "margin-desktop": "64px",
                        "gutter": "24px",
                        "xl": "80px",
                        "margin-mobile": "16px",
                        "lg": "48px",
                        "sm": "12px"
                    },
                    "fontFamily": {
                        "body-lg": ["Sora"],
                        "label-caps": ["Sora"],
                        "display-lg-mobile": ["Sora"],
                        "headline-md": ["Sora"],
                        "display-lg": ["Sora"],
                        "body-sm": ["Sora"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "display-lg-mobile": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #0b1326;
            color: #dae2fd;
            -webkit-font-smoothing: antialiased;
        }
        .adventure-map-bg {
            background-image: 
                linear-gradient(rgba(11, 19, 38, 0.9), rgba(11, 19, 38, 0.9)),
                radial-gradient(circle at 2px 2px, rgba(0, 218, 243, 0.05) 1px, transparent 0);
            background-size: 100% 100%, 40px 40px;
        }
        .organic-path {
            position: absolute;
            top: 0;
            left: 50%;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, #00feb1 0%, #00feb1 25%, #00daf3 25%, #00daf3 30%, rgba(132, 147, 150, 0.2) 30%);
            transform: translateX(-50%);
            z-index: 0;
        }
        .glass-card {
            background: rgba(45, 52, 73, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-sm text-body-sm overflow-x-hidden">
<!-- Top Navigation Anchor -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface/60 backdrop-blur-xl border-b border-outline-variant/20 flex justify-between items-center px-margin-mobile h-16 shadow-[0_0_20px_rgba(0,218,243,0.15)]">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">grid_view</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-surface-tint">Mathemagix</h1>
</div>
<div class="flex items-center gap-2 bg-surface-container-high px-3 py-1.5 rounded-full border border-outline-variant/30">
<span class="material-symbols-outlined text-tertiary-fixed-dim text-sm" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="font-label-caps text-label-caps text-on-surface">12/300</span>
</div>
</header>
<!-- Progress Dashboard (Sub-Header) -->
<div class="fixed top-16 left-0 w-full z-40 bg-surface-container-low/90 backdrop-blur-md px-margin-mobile py-4 border-b border-outline-variant/10">
<div class="flex flex-col gap-2 max-w-md mx-auto">
<div class="flex justify-between items-center">
<span class="font-label-caps text-label-caps text-on-surface-variant">Chapter 1: The Sequence</span>
<span class="font-label-caps text-label-caps text-primary">60% to Chapter 2</span>
</div>
<div class="w-full h-2 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-secondary-fixed shadow-[0_0_8px_#00feb1]" style="width: 60%;"></div>
</div>
</div>
</div>
<!-- Main Map Canvas -->
<main class="relative pt-40 pb-32 adventure-map-bg min-h-screen">
<div class="max-w-md mx-auto relative px-margin-mobile">
<!-- SVG Path visualization (Dashed/Organic) -->
<div class="organic-path"></div>
<!-- Level Nodes Container -->
<div class="flex flex-col items-center gap-20 relative z-10">
<!-- Level 1: Completed -->
<div class="flex flex-col items-center translate-x-[-40px]">
<div class="w-16 h-16 rounded-full bg-surface-container border-2 border-secondary-container shadow-[0_0_15px_rgba(0,254,177,0.4)] flex items-center justify-center relative">
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">check</span>
<div class="absolute -bottom-6 font-label-caps text-label-caps text-secondary-container">Level 1</div>
</div>
</div>
<!-- Level 2: Completed -->
<div class="flex flex-col items-center translate-x-[60px]">
<div class="w-16 h-16 rounded-full bg-surface-container border-2 border-secondary-container shadow-[0_0_15px_rgba(0,254,177,0.4)] flex items-center justify-center relative">
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">check</span>
<div class="absolute -bottom-6 font-label-caps text-label-caps text-secondary-container">Level 2</div>
</div>
</div>
<!-- Level 3: Completed -->
<div class="flex flex-col items-center translate-x-[-20px]">
<div class="w-16 h-16 rounded-full bg-surface-container border-2 border-secondary-container shadow-[0_0_15px_rgba(0,254,177,0.4)] flex items-center justify-center relative">
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">check</span>
<div class="absolute -bottom-6 font-label-caps text-label-caps text-secondary-container">Level 3</div>
</div>
</div>
<!-- Level 4: Completed -->
<div class="flex flex-col items-center translate-x-[40px]">
<div class="w-16 h-16 rounded-full bg-surface-container border-2 border-secondary-container shadow-[0_0_15px_rgba(0,254,177,0.4)] flex items-center justify-center relative">
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">check</span>
<div class="absolute -bottom-6 font-label-caps text-label-caps text-secondary-container">Level 4</div>
</div>
</div>
<!-- Level 5: Completed -->
<div class="flex flex-col items-center translate-x-[-50px]">
<div class="w-16 h-16 rounded-full bg-surface-container border-2 border-secondary-container shadow-[0_0_15px_rgba(0,254,177,0.4)] flex items-center justify-center relative">
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">check</span>
<div class="absolute -bottom-6 font-label-caps text-label-caps text-secondary-container">Level 5</div>
</div>
</div>
<!-- Level 6: Current (Active) -->
<div class="flex flex-col items-center translate-x-[30px] scale-125">
<div class="w-16 h-16 rounded-full bg-primary-container border-2 border-primary shadow-[0_0_25px_rgba(0,218,243,0.8)] flex items-center justify-center relative animate-pulse">
<span class="text-on-primary-container font-bold text-lg">6</span>
<div class="absolute -bottom-8 font-label-caps text-label-caps text-primary font-bold">PLAYING</div>
<!-- Decorative Orbit -->
<div class="absolute inset-0 border border-primary/30 rounded-full animate-[spin_4s_linear_infinite] scale-150"></div>
</div>
</div>
<!-- Level 7: Locked -->
<div class="flex flex-col items-center translate-x-[-10px] opacity-60">
<div class="w-14 h-14 rounded-full bg-surface-container border-2 border-outline-variant flex items-center justify-center relative">
<span class="material-symbols-outlined text-outline">lock</span>
<div class="absolute -bottom-6 font-label-caps text-label-caps text-on-surface-variant">Level 7</div>
</div>
</div>
<!-- Level 8: Locked -->
<div class="flex flex-col items-center translate-x-[50px] opacity-40">
<div class="w-14 h-14 rounded-full bg-surface-container border-2 border-outline-variant flex items-center justify-center relative">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
</div>
<!-- Spacer for more levels -->
<div class="h-40 flex items-center justify-center w-full">
<div class="w-1 h-20 border-l-2 border-dotted border-outline-variant/40"></div>
</div>
<!-- Chapter Milestone: Level 20 -->
<div class="flex flex-col items-center relative mb-12">
<div class="w-24 h-24 glass-card rounded-2xl flex flex-col items-center justify-center relative border-primary-container/40 shadow-[0_0_40px_rgba(255,181,157,0.1)]">
<span class="material-symbols-outlined text-tertiary-fixed-dim text-4xl" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="font-label-caps text-label-caps text-tertiary-fixed-dim mt-1">LVL 20</span>
<!-- Spiral decoration -->
<div class="absolute -inset-4 border border-tertiary-container/10 rounded-full"></div>
</div>
<div class="absolute -bottom-10 whitespace-nowrap font-headline-md text-headline-md text-tertiary-fixed-dim tracking-tight">THE GRAND FINALE</div>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation Shell -->
<nav class="fixed bottom-0 left-0 w-full z-50 bg-surface-container/80 backdrop-blur-md border-t border-outline-variant/20 h-20 px-4 pb-safe flex justify-around items-center rounded-t-xl shadow-[0_-5px_20px_rgba(0,0,0,0.4)]">
<a class="flex flex-col items-center justify-center text-primary-fixed-dim drop-shadow-[0_0_8px_rgba(0,218,243,0.5)] scale-110" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-caps text-label-caps mt-1">MAP</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant/60 hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined">shopping_bag</span>
<span class="font-label-caps text-label-caps mt-1">SHOP</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant/60 hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined">leaderboard</span>
<span class="font-label-caps text-label-caps mt-1">STATS</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant/60 hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-caps text-label-caps mt-1">ME</span>
</a>
</nav>
<!-- Contextual FAB for Play (Current Level) -->
<button class="fixed bottom-24 right-6 w-16 h-16 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center shadow-[0_8px_25px_rgba(0,218,243,0.4)] active:scale-90 transition-transform z-50">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
<!-- Background Decoration Grid Layer -->
<div class="fixed inset-0 pointer-events-none z-0">
<div class="absolute top-1/4 left-10 w-32 h-32 border border-primary/5 rounded-full rotate-45"></div>
<div class="absolute bottom-1/3 right-[-20px] w-64 h-64 border border-secondary-container/5 rounded-full"></div>
</div>
</body></html>
