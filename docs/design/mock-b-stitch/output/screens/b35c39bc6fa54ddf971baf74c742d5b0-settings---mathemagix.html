<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    body {
      font-family: 'Sora', sans-serif;
      background-color: #0b1326;
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .glass-card {
      background: rgba(45, 52, 73, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .neon-glow-cyan {
      box-shadow: 0 0 15px rgba(0, 218, 243, 0.3);
    }
    .neon-glow-error {
      box-shadow: 0 0 15px rgba(255, 180, 171, 0.15);
    }
  </style>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface-bright": "#31394d",
            "on-surface": "#dae2fd",
            "on-secondary": "#003824",
            "on-tertiary-container": "#a23200",
            "primary-fixed": "#9cf0ff",
            "outline-variant": "#3b494c",
            "tertiary": "#ffe8e1",
            "background": "#0b1326",
            "on-background": "#dae2fd",
            "surface-container-high": "#222a3d",
            "on-primary-container": "#00626e",
            "inverse-primary": "#006875",
            "surface-container-low": "#131b2e",
            "on-surface-variant": "#bac9cc",
            "on-secondary-fixed": "#002113",
            "surface-variant": "#2d3449",
            "secondary": "#f4fff6",
            "on-error-container": "#ffdad6",
            "tertiary-fixed-dim": "#ffb59d",
            "on-tertiary-fixed": "#390c00",
            "on-primary": "#00363d",
            "surface-container-lowest": "#060e20",
            "surface": "#0b1326",
            "on-secondary-fixed-variant": "#005236",
            "surface-dim": "#0b1326",
            "surface-tint": "#00daf3",
            "on-primary-fixed": "#001f24",
            "primary": "#c3f5ff",
            "error": "#ffb4ab",
            "inverse-on-surface": "#283044",
            "primary-fixed-dim": "#00daf3",
            "secondary-container": "#00feb1",
            "secondary-fixed-dim": "#00e29d",
            "on-secondary-container": "#00714d",
            "outline": "#849396",
            "surface-container": "#171f33",
            "on-error": "#690005",
            "inverse-surface": "#dae2fd",
            "on-tertiary-fixed-variant": "#832600",
            "on-tertiary": "#5d1900",
            "on-primary-fixed-variant": "#004f58",
            "tertiary-container": "#ffc3b0",
            "primary-container": "#00e5ff",
            "error-container": "#93000a",
            "surface-container-highest": "#2d3449",
            "tertiary-fixed": "#ffdbd0",
            "secondary-fixed": "#47ffb8"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "margin-desktop": "64px",
            "xs": "4px",
            "md": "24px",
            "margin-mobile": "16px",
            "base": "8px",
            "lg": "48px",
            "xl": "80px",
            "sm": "12px",
            "gutter": "24px"
          },
          "fontFamily": {
            "body-sm": ["Sora"],
            "display-lg": ["Sora"],
            "label-caps": ["Sora"],
            "headline-md": ["Sora"],
            "display-lg-mobile": ["Sora"],
            "body-lg": ["Sora"]
          },
          "fontSize": {
            "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
            "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
            "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
            "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
            "display-lg-mobile": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
            "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}]
          }
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface min-h-screen pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 h-16 bg-surface-container/60 backdrop-blur-xl flex items-center justify-between px-margin-mobile border-b border-white/10 shadow-[0_0_15px_rgba(0,218,243,0.1)]">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform text-primary">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary">Settings</h1>
</div>
<div class="w-10 h-10 rounded-full border border-primary/20 flex items-center justify-center overflow-hidden">
<img alt="User Avatar" class="w-8 h-8" data-alt="A futuristic vector illustration of a robotic avatar with neon blue glowing eyes and mechanical details. The character is set against a dark background with digital circuit patterns, perfectly matching the Mathemagix game's tech-heavy aesthetic. High contrast and sleek metal textures." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDFFvoCWpaxuPQS49BUP2UoB-HbYgQoPb7ilRSTmvR5GfBHIZiC_CZCzOol6wGkn0pOcHJxajwuDCmuwkth8idDdq84qDsqaGCALRTsJzAZQ2vs7WqJxKPLR-mBwExWi1DZWmkAU7_ddb-HAbz24dCXNtKdF7wNDbckmYpWKdXMR4OrIK4iB_3RQCEbHz9EexhKyT9r4vicZwHk03JUn6pIKofDkBjE-pCAhtNrfkTxRMtxaRBdH2dtxcxYGTWYowGEiqRBK9OgiXA"/>
</div>
</header>
<main class="pt-24 px-margin-mobile max-w-2xl mx-auto space-y-8">
<!-- Section: AUDIO & HAPTICS -->
<section>
<h2 class="font-label-caps text-label-caps text-on-surface-variant mb-4 px-1">AUDIO &amp; HAPTICS</h2>
<div class="glass-card rounded-xl p-4 space-y-6">
<!-- Toggle Item -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary opacity-80">music_note</span>
<span class="font-body-lg text-body-lg">Master Music</span>
</div>
<button class="w-12 h-6 rounded-full bg-primary-container relative transition-colors neon-glow-cyan">
<div class="absolute right-1 top-1 w-4 h-4 rounded-full bg-on-primary"></div>
</button>
</div>
<!-- Toggle Item -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary opacity-80">volume_up</span>
<span class="font-body-lg text-body-lg">Sound Effects</span>
</div>
<button class="w-12 h-6 rounded-full bg-primary-container relative transition-colors neon-glow-cyan">
<div class="absolute right-1 top-1 w-4 h-4 rounded-full bg-on-primary"></div>
</button>
</div>
<!-- Toggle Item -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary opacity-80">vibration</span>
<span class="font-body-lg text-body-lg">Haptic Feedback</span>
</div>
<button class="w-12 h-6 rounded-full bg-surface-container-highest relative transition-colors">
<div class="absolute left-1 top-1 w-4 h-4 rounded-full bg-on-surface-variant"></div>
</button>
</div>
</div>
</section>
<!-- Section: GAMEPLAY -->
<section>
<h2 class="font-label-caps text-label-caps text-on-surface-variant mb-4 px-1">GAMEPLAY</h2>
<div class="glass-card rounded-xl p-6 space-y-6">
<div class="flex flex-col gap-4">
<div class="flex justify-between items-end">
<label class="font-body-lg text-body-lg">Difficulty</label>
<span class="font-label-caps text-label-caps text-primary">Master</span>
</div>
<div class="relative h-2 bg-surface-container-highest rounded-full w-full">
<div class="absolute h-2 bg-primary-fixed-dim rounded-full neon-glow-cyan" style="width: 66%;"></div>
<div class="absolute top-1/2 -translate-y-1/2 w-4 h-4 bg-primary-fixed border-2 border-on-primary rounded-full" style="left: 66%;"></div>
</div>
<div class="flex justify-between font-label-caps text-label-caps text-on-surface-variant opacity-60">
<span>Apprentice</span>
<span>Master</span>
<span>Genius</span>
</div>
</div>
</div>
</section>
<!-- Section: DATA -->
<section>
<h2 class="font-label-caps text-label-caps text-on-surface-variant mb-4 px-1">DATA</h2>
<div class="glass-card rounded-xl p-2 space-y-2">
<button class="w-full flex items-center justify-between p-4 rounded-lg hover:bg-error-container/20 transition-colors group">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-error">history</span>
<span class="font-body-lg text-body-lg text-error">Reset Progress</span>
</div>
<span class="material-symbols-outlined text-error opacity-0 group-hover:opacity-100 transition-opacity">chevron_right</span>
</button>
<div class="h-px bg-white/5 mx-4"></div>
<button class="w-full flex items-center justify-between p-4 rounded-lg hover:bg-error-container/20 transition-colors group">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-error">delete_sweep</span>
<span class="font-body-lg text-body-lg text-error">Clear Cache</span>
</div>
<span class="material-symbols-outlined text-error opacity-0 group-hover:opacity-100 transition-opacity">chevron_right</span>
</button>
</div>
</section>
<!-- Section: ABOUT -->
<section>
<h2 class="font-label-caps text-label-caps text-on-surface-variant mb-4 px-1">ABOUT</h2>
<div class="glass-card rounded-xl overflow-hidden">
<div class="p-4 flex items-center justify-between">
<div class="flex flex-col">
<span class="font-body-lg text-body-lg">Version</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">2.4.0-quantum</span>
</div>
<button class="px-6 py-2 bg-surface-container-high border border-white/10 rounded-lg font-label-caps text-label-caps hover:bg-primary/10 transition-colors">Credits</button>
</div>
</div>
</section>
<!-- Legal Links -->
<footer class="flex flex-col items-center gap-4 py-8 opacity-40">
<div class="flex gap-6">
<a class="font-label-caps text-label-caps hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="font-label-caps text-label-caps hover:text-primary transition-colors" href="#">Terms of Service</a>
</div>
<p class="font-label-caps text-[10px]">© 2024 NEXUS GAMES STUDIO</p>
</footer>
</main>
<!-- BottomNavBar (Visible on Mobile) -->
<nav class="fixed bottom-0 left-0 w-full z-50 bg-surface-container-low/80 backdrop-blur-lg border-t border-white/5 flex justify-around items-center px-4 py-2 rounded-t-xl shadow-[0_-4px_20px_rgba(0,0,0,0.5)] md:hidden">
<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-70 hover:text-primary transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined">videogame_asset</span>
<span class="font-label-caps text-label-caps mt-1">Play</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-70 hover:text-primary transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined">grid_view</span>
<span class="font-label-caps text-label-caps mt-1">Library</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-70 hover:text-primary transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined">shopping_bag</span>
<span class="font-label-caps text-label-caps mt-1">Store</span>
</button>
<button class="flex flex-col items-center justify-center text-primary-fixed bg-surface-variant/50 rounded-xl px-4 py-1 shadow-[0_0_10px_rgba(0,218,243,0.2)] active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-caps text-label-caps mt-1">Settings</span>
</button>
</nav>
</body></html>
