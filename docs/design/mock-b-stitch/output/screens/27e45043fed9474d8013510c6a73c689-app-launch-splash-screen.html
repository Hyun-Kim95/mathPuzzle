<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        
        .bloom-effect {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(192, 193, 255, 0.15) 0%, rgba(11, 19, 38, 0) 70%);
            filter: blur(60px);
            z-index: -1;
            pointer-events: none;
        }

        .mesh-gradient {
            background-image: 
                radial-gradient(at 0% 0%, rgba(128, 131, 255, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(76, 215, 246, 0.05) 0px, transparent 50%);
        }

        @keyframes progress-glow {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(400%); }
        }

        .animate-progress {
            animation: progress-glow 2s infinite ease-in-out;
        }
    </style>

<body class="bg-surface text-on-surface font-body-md overflow-hidden h-screen w-screen flex flex-col items-center justify-center relative mesh-gradient">

                ELITE
            </h1>
</div>

<div class="absolute bottom-16 left-0 w-full flex flex-col items-center space-y-stack-md">
<!-- Tagline -->
<p class="font-label-sm text-label-sm text-on-surface-variant tracking-widest uppercase opacity-80">
                Precision in Every Move
            </p>
<!-- Sophisticated Loading Bar Container -->
<div class="w-48 h-[2px] bg-outline-variant/20 rounded-full overflow-hidden relative">
<!-- Glowing Progress Inner -->
<div class="absolute top-0 left-0 h-full w-1/4 bg-gradient-to-r from-secondary to-primary animate-progress shadow-[0_0_8px_rgba(192,193,255,0.6)]"></div>
</div>
</div>
</main>
<!-- Corner Accents (Precision Details) -->
<div class="fixed top-8 left-8 border-l border-t border-outline-variant/30 w-12 h-12"></div>
<div class="fixed top-8 right-8 border-r border-t border-outline-variant/30 w-12 h-12"></div>
